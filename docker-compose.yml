services:

  api-blue:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    expose:
      - "8080"
    ports:
      - "8081:8080"
    restart: always

  api-green:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    expose:
      - "8080"
    ports:
      - "8082:8080"
    restart: always

  nginx:
    image: nginx:alpine
    container_name: ebay_nginx_lb
    volumes:
      - ./Backend/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./Backend/upstream.conf:/etc/nginx/upstream.conf:ro
      - ./Backend/proxy.conf:/etc/nginx/proxy.conf:ro
    ports:
      - "7233:80"
    restart: always

    
